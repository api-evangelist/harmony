aid: harmony
name: Harmony
description: >-
  Harmony is an agentic enterprise service management (ESM) platform that gives every employee an
  always-on AI expert for IT, HR, finance, procurement, and legal service requests inside Slack and
  Microsoft Teams. Its AI agents autonomously resolve requests — password and MFA resets, application
  access, device recovery, employee onboarding and offboarding — using a context graph that connects
  each employee's identity, devices, applications, and history, often resolving issues before a ticket
  is opened. Harmony exposes a public REST Service Desk API for programmatically listing, creating,
  updating, querying, and bulk-updating tickets along with their custom fields and activity history.
  Founded in 2025 by Nitzan Shapira and Ran Ribenzaft and backed by Lightspeed Venture Partners.
